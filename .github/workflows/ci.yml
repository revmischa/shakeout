name: ci

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 4 * * *"  # nightly tier
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: lint and types
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
      - run: uv lock --check
      - run: uv sync --locked --python 3.14
      - run: uv run ruff format --check .
      - run: uv run ruff check --output-format=github .
      - run: uv run pyright
      - run: uv run mypy
      - run: uv run codespell src tests/*.py tests/harness tests/unit tests/fuzz/*.py docs README.md
      - run: uv run vulture src vulture_whitelist.py --min-confidence 60
      - run: uv run validate-pyproject pyproject.toml
      - run: uv run actionlint
      - run: uv run zizmor --persona=pedantic --quiet .github/workflows

  test:
    name: test (${{ matrix.os }}, ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.10", "3.11", "3.12", "3.13", "3.14", "3.15"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
      - run: uv sync --locked --python "$PYTHON"
        env:
          PYTHON: ${{ matrix.python }}
      - name: tests (branch coverage gate on one interpreter)
        env:
          PYTHON: ${{ matrix.python }}
          OS: ${{ matrix.os }}
        run: |
          if [ "$PYTHON" = "3.14" ] && [ "$OS" = "ubuntu-latest" ]; then
            uv run pytest -n auto --cov --cov-report=term-missing:skip-covered
          else
            uv run pytest -n auto
          fi

  package:
    name: package and docs
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
      - run: uv sync --locked --python 3.14 --group docs
      - run: uv run mkdocs build --strict --site-dir build/site
      - run: uv build
      - run: uv run twine check --strict dist/*
      - run: uv run check-wheel-contents dist/*.whl
      - run: uv run --isolated --no-project --with dist/*.whl shakeout --version

  audit:
    name: dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
      - run: uv sync --locked --python 3.14
      - run: uv export --frozen --all-groups --no-hashes --no-emit-project -o requirements.txt
      - run: uv run pip-audit --strict --progress-spinner off -r requirements.txt

  nightly:
    name: nightly (corpus, long fuzz, mutation)
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
      - run: uv sync --locked --python 3.14
      - name: corpus and 1500-program fuzz campaign
        run: uv run pytest -n auto -m nightly
      - name: mutation testing of the analysis core
        run: scripts/mutation.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        if: always()
        with:
          name: nightly-results
          path: |
            tests/corpus/metrics.json
            tests/fuzz/failures/
            mutants/
          if-no-files-found: ignore
