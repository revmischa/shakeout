name: ci

on:
  push:
  pull_request:
  schedule:
    - cron: "17 4 * * *"  # nightly tier
  workflow_dispatch:

jobs:
  presubmit:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python: ["3.10", "3.11", "3.12", "3.13", "3.14", "3.15"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --python ${{ matrix.python }}
      - run: uv run ruff check src tests
      - run: uv run pyright
      - run: uv run pytest -n auto

  nightly:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --python 3.14
      - name: corpus, long fuzz campaign
        run: uv run pytest -n auto -m nightly
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nightly-results
          path: |
            tests/corpus/metrics.json
            tests/fuzz/failures/
