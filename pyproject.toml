[project]
name = "shakeout"
version = "0.1.1"
description = "Static tree-shaking bundler for Python"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
keywords = ["bundler", "tree-shaking", "aws-lambda", "zipapp", "dead-code"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: 3.15",
  "Topic :: Software Development :: Build Tools",
  "Typing :: Typed",
]
dependencies = ["tomli>=2; python_version < '3.11'"]

[project.urls]
Homepage = "https://github.com/revmischa/shakeout"
Documentation = "https://revmischa.github.io/shakeout/"
Repository = "https://github.com/revmischa/shakeout"
Issues = "https://github.com/revmischa/shakeout/issues"
Changelog = "https://github.com/revmischa/shakeout/blob/main/CHANGELOG.md"

[project.scripts]
shakeout = "shakeout.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "tomli>=2; python_version<'3.11'",
    "pytest>=8",
    "hypothesis>=6",
    "ruff>=0.6",
    "pyright>=1.1.380",
    "pytest-xdist>=3",
    "mypy>=2.4.1",
    "coverage[toml]>=7.6",
    "pytest-cov>=7.1.0",
    "pytest-randomly>=5.0.0",
    "pytest-timeout>=2.4.0",
    "codespell>=2.4.3",
    "vulture>=2.16",
    "validate-pyproject>=0.27",
    "twine>=7.0.0",
    "check-wheel-contents>=0.6.3",
    "pip-audit>=2.10.1",
    "zizmor>=1.30.1",
    "actionlint-py>=1.7.12.25",
    "pre-commit>=4.6.2",
    "mutmut>=3.8.1",
    "typing-extensions>=4.16.0",
]
docs = [
    "mkdocs-material>=9.6",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
minversion = "8.0"
addopts = [
  "-ra",
  "--strict-markers",
  "--strict-config",
  "--import-mode=importlib",
  "-m", "not nightly",
  "-p", "no:legacypath",
]
xfail_strict = true
filterwarnings = ["error"]
timeout = 300
markers = [
  "nightly: slow tier (corpus, long fuzz); run with -m nightly",
]

[tool.coverage.run]
branch = true
source = ["shakeout"]
parallel = true
concurrency = ["multiprocessing"]
patch = ["subprocess"]  # measure `python -m shakeout` runs started by the CLI tests

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 96
precision = 2  # compare exactly (the default rounds 95.99 up to 96)
exclude_also = [
  "if TYPE_CHECKING:",
  "raise NotImplementedError",
  "@overload",
]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]
# Fixtures are inputs to the bundler, not project code: they deliberately contain odd Python.
extend-exclude = ["tests/cases", "tests/corpus/drivers", "tests/fuzz/failures"]

[tool.ruff.format]
docstring-code-format = true

[tool.ruff.lint]
select = ["ALL"]
# Every ignore needs a reason. Keep this list short.
ignore = [
  "COM812",  # trailing commas are owned by the formatter (ruff docs: conflicts with format)
  "CPY001",  # no per-file copyright headers; the license lives in pyproject.toml
  "TRY003",  # long exception messages are the product here (diagnostics must be explicit)
  "D105",    # magic methods are documented by the data model
  "D107",    # __init__ is documented on the class
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = [
  "S101",     # pytest uses assert
  "D",        # test names and module docstrings describe intent; per-test docstrings are noise
  "PLR2004",  # literal expected values are the point of a test
  "S603",     # tests run the interpreter under test via subprocess with fixed argv
  "S108",     # literal /tmp paths in traceback-normalizer fixtures, never opened
  "INP001",   # tests/ is not a package-installed namespace
]
"src/shakeout/cli.py" = ["T201"]  # a CLI prints
"src/shakeout/runtime.py" = ["D"]
# Vulture whitelists are bare attribute expressions by design.
"vulture_whitelist.py" = ["B018", "SLF001", "INP001"]  # embedded into bundles: a docstring would become __doc__
# ast.NodeVisitor dictates visit_<Node> names; they implement dispatch, not a public API
"src/shakeout/analysis/scopes.py" = ["N802", "N815", "D102"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.mccabe]
max-complexity = 12

[tool.ruff.lint.pylint]
max-args = 6
max-branches = 14
max-returns = 8
max-statements = 50

[tool.ruff.lint.flake8-pytest-style]
fixture-parentheses = false
mark-parentheses = false

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.pyright]
include = ["src", "tests"]
exclude = ["tests/cases", "tests/corpus/drivers", "tests/fuzz/failures", "**/__pycache__"]
typeCheckingMode = "strict"
pythonVersion = "3.10"
reportMissingModuleSource = "none"
reportImplicitOverride = "error"
reportImportCycles = "error"
reportPropertyTypeMismatch = "error"
reportUninitializedInstanceVariable = "error"
reportUnnecessaryTypeIgnoreComment = "error"
reportMissingSuperCall = "none"
deprecateTypingAliases = true
enableTypeIgnoreComments = false  # "# type: ignore" is for mypy, "# pyright: ignore" for pyright

[tool.mypy]
python_version = "3.10"
files = ["src", "tests"]
exclude = ["^tests/cases/", "^tests/corpus/drivers/", "^tests/fuzz/failures/"]
strict = true
warn_unreachable = true
enable_error_code = [
  "redundant-expr", "truthy-bool", "truthy-iterable", "ignore-without-code",
  "possibly-undefined", "redundant-self", "explicit-override", "unused-awaitable",
  "unimported-reveal", "mutable-override", "exhaustive-match",
]

[tool.mutmut]
source_paths = ["src/shakeout/analysis/effects.py", "src/shakeout/analysis/classes.py", "src/shakeout/graph.py"]
pytest_add_cli_args = ["-p", "no:randomly", "-p", "no:cacheprovider", "-m", "not nightly"]
pytest_add_cli_args_test_selection = [
  "tests/unit/test_effects.py", "tests/unit/test_classes.py", "tests/unit/test_emit_properties.py",
  "tests/unit/test_config_and_cli.py", "tests/test_cases.py",
  "-k", "expectations or golden or effects or classes or more_keeps or keep",
]
also_copy = ["tests", "src/shakeout"]
